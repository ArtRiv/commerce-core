# Render Blueprint — the deployed topology, in review rather than in a dashboard.
#
# Everything here that is NOT a secret is a literal `value`, on purpose. Freight
# prices, the sender address and the proxy hop count are business decisions that
# deserve a diff and a reviewer; parked in a dashboard textarea they change
# without a trace and nobody can tell what production is charging.
#
# Everything that IS a secret is `sync: false`, which makes Render prompt for it
# once at blueprint creation and never store it here. See docs/specs/deploy.md.

services:
  - name: commerce-core
    type: web
    runtime: docker
    plan: free
    # Closest of Render's five regions to Brazil. Create the production Supabase
    # project in us-east-1 to match — every request in a checkout makes several
    # round trips to Postgres, and a cross-continent hop shows up in all of them.
    region: virginia
    dockerfilePath: ./Dockerfile

    # GET / is a liveness probe: it touches no database and no provider, which
    # is what a probe whose failure RESTARTS the container should do
    # (src/app.controller.ts). The database check that a deploy actually needs
    # happens once, in the entrypoint, where a bad DATABASE_URL fails the deploy
    # instead of becoming a restart loop.
    healthCheckPath: /

    # Deploy a commit only once CI has gone green on it. The repo's whole
    # premise is spec → tests → merge; shipping a commit before its tests are
    # known to pass would be the one place that discipline stopped applying.
    # Switch to `commit` if a flaky check ever stalls a deploy that matters.
    autoDeployTrigger: checksPass

    envVars:
      # --- The two boot guards, satisfied explicitly ------------------------
      # Anything other than development/test makes Stripe and SHIPPING_TABLE
      # mandatory. That is the entire reason this line exists.
      - key: NODE_ENV
        value: production

      # One proxy — Render's — between the internet and the container. Without
      # it every caller shares one rate-limit bucket; with `true` instead of a
      # count, a forged X-Forwarded-For buys a fresh one (src/trust-proxy.ts).
      - key: TRUST_PROXY_HOPS
        value: 1

      # Real freight, not the built-in development table. Prices are reviewable
      # here rather than invisible in a dashboard.
      - key: SHIPPING_TABLE
        value: '[{"code":"padrao-sudeste","label":"Entrega padrão","prefixes":["0","1","2","3"],"etaDays":5,"rates":[{"upToGrams":1000,"priceCents":1990},{"upToGrams":30000,"priceCents":3990}]},{"code":"padrao-brasil","label":"Entrega padrão","prefixes":["4","5","6","7","8","9"],"etaDays":10,"rates":[{"upToGrams":30000,"priceCents":4990}]}]'

      # Only reached by a product with no weight of its own. The seeded catalog
      # carries real weights, so this is a floor, not the usual case.
      - key: SHIPPING_DEFAULT_WEIGHT_GRAMS
        value: 500

      # --- Money and mail: explicit rather than defaulted -------------------
      - key: STRIPE_CURRENCY
        value: brl
      - key: STRIPE_CHECKOUT_MODE
        value: hosted

      # A domain VERIFIED in Resend. The sandbox sender (onboarding@resend.dev)
      # delivers only to the Resend account owner's own address, so every order
      # e-mail would silently reach nobody — and nothing in the app would report
      # a problem. Pinned here so it cannot quietly become the sandbox again.
      - key: MAIL_FROM
        value: Commerce Core <nao-responda@fel.tec.br>

      # --- Secrets: prompted once, never stored in the repo -----------------
      # Production Postgres. Use the Supabase POOLER host, not db.<ref>.supabase.co
      # — the direct host publishes no A record and is unreachable from anything
      # without IPv6 egress. Must be a DIFFERENT project from the one used for
      # local development: the e2e suite TRUNCATEs the tables it points at.
      - key: DATABASE_URL
        sync: false

      # Generated by Render, seen by nobody. Production sessions should not be
      # forgeable by anyone holding the development secret.
      - key: JWT_SECRET
        generateValue: true

      - key: RESEND_API_KEY
        sync: false

      # The signing secret of the webhook endpoint created for THIS service's
      # URL. Not an API key, and not the whsec_ that `stripe listen` prints
      # locally — each endpoint has its own.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # THIS service's public origin, with scheme — https://<name>.onrender.com.
      # Not derivable from `fromService`, which yields a bare hostname, and the
      # Google OAuth callback is built by concatenation.
      - key: API_URL
        sync: false

      # The FRONTEND's origin, which is a different thing: verification and
      # reset links, plus Stripe's success/cancel URLs, are pages there.
      - key: APP_URL
        sync: false

      # GOOGLE_OAUTH_CLIENT_ID / _SECRET are deliberately absent. The app boots
      # without them and /auth/google answers 503; add them in the dashboard
      # once ${API_URL}/auth/google/callback is registered in the Google console.
